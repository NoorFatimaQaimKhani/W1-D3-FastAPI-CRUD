services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: customer_records
      POSTGRES_PASSWORD: customer_records_test
      POSTGRES_DB: customer_records_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_records -d customer_records_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
